<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flores</title>
  <link rel="shortcut icon" href="img/flor-de-lotus.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-pink">
    <a class="navbar-brand" href="#">
      <img class="logo" src="img/flor-de-lotus-nav.png" alt="Flores" />
    </a>
    <span class="navbar-text">
      <h1>IFSULDEMINAS - Categorizador de Flores</h1>
    </span>
  </nav>

  <!-- main container -->
  <div class="container main-content text-center">
    <div class="button-group">
      <button class="btn btn-flower" id="btnChangeCamera" title="Trocar câmera">
        <img class="img-btn" src="img/mobileT.png" alt="Frontal">
      </button>
      <button class="btn btn-flower" id="btnCloseCamera" title="Fechar câmera">
        <img class="img-btn" src="img/fechar.png" alt="Fechar">
      </button>
      <button class="btn btn-flower" type="button" onclick="init()" title="Traseira">
        <img class="img-btn" src="img/mobileF.png" alt="Traseira">
      </button>
    </div>

    <div id="webcam-container" class="webcam-box"></div>
    <div class="textcom" id="label-container"></div>
  </div>

  <!-- footer -->
  <footer class="footer">
    Todos direitos reservados - Departamento de Computação - IFSULDEMINAS - Campus Machado
  </footer>

  <!-- scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
